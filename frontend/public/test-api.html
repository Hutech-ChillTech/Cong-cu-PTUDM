<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test ChatBox API</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
      }
      .test-section {
        margin: 20px 0;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      button {
        background: #667eea;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        margin: 5px;
      }
      button:hover {
        background: #764ba2;
      }
      pre {
        background: #f5f5f5;
        padding: 15px;
        border-radius: 5px;
        overflow-x: auto;
      }
      .success {
        color: green;
      }
      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>🧪 ChatBox API Tester</h1>

    <div class="test-section">
      <h2>Test 1: Check Server</h2>
      <button onclick="testServer()">Test GET /</button>
      <pre id="server-result">Chưa test...</pre>
    </div>

    <div class="test-section">
      <h2>Test 2: Chat API (Port 5000)</h2>
      <button onclick="testChatAPI(5000)">
        Test POST /api/chat (Port 5000)
      </button>
      <pre id="chat-5000-result">Chưa test...</pre>
    </div>

    <div class="test-section">
      <h2>Test 3: Chat API (Port 3001)</h2>
      <button onclick="testChatAPI(3001)">
        Test POST /api/chat (Port 3001)
      </button>
      <pre id="chat-3001-result">Chưa test...</pre>
    </div>

    <div class="test-section">
      <h2>Test 4: Alternative Endpoints</h2>
      <button onclick="testAlternative()">Test Alternative Endpoints</button>
      <pre id="alt-result">Chưa test...</pre>
    </div>

    <script>
      const API_URL = "https://skillcoder.onrender.com";

      async function testServer() {
        const result = document.getElementById("server-result");
        result.textContent = "Testing...";

        try {
          const response = await fetch(`${API_URL}/`);
          const data = await response.json();
          result.innerHTML = `<span class="success">✅ SUCCESS</span>\n${JSON.stringify(data, null, 2)}`;
        } catch (error) {
          result.innerHTML = `<span class="error">❌ ERROR</span>\n${error.message}`;
        }
      }

      async function testChatAPI(port) {
        const resultId = `chat-${port}-result`;
        const result = document.getElementById(resultId);
        result.textContent = "Testing...";

        try {
          const response = await fetch(`${API_URL}/api/chat`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              message: "Xin chào!",
              language: "vi",
            }),
          });

          const data = await response.json();
          result.innerHTML = `<span class="success">✅ SUCCESS (${response.status})</span>\n${JSON.stringify(data, null, 2)}`;
        } catch (error) {
          result.innerHTML = `<span class="error">❌ ERROR</span>\n${error.message}\n\nCó thể là:\n• CORS issue\n• Server không chạy\n• Endpoint không đúng`;
        }
      }

      async function testAlternative() {
        const result = document.getElementById("alt-result");
        result.textContent = "Testing multiple endpoints...";

        const endpoints = [
          `${API_URL}/chat`,
          `${API_URL}/api/chatbot`,
          `${API_URL}/api/chat`,
        ];

        let results = "";

        for (const endpoint of endpoints) {
          try {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message: "test", language: "vi" }),
            });

            const data = await response.json();
            results += `✅ ${endpoint}: SUCCESS\n${JSON.stringify(data, null, 2)}\n\n`;
          } catch (error) {
            results += `❌ ${endpoint}: ${error.message}\n\n`;
          }
        }

        result.textContent = results;
      }
    </script>
  </body>
</html>
